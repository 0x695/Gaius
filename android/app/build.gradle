def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

android {
    if (buildAsApplication) {
        namespace "org.gaius.game"
    }
    compileSdkVersion 34
    ndkVersion "29.0.14206865"
    defaultConfig {
        applicationId "org.gaius.game"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "0.9"
        externalNativeBuild {
            // Phones and tablets (arm64-v8a) and the emulator (x86_64).
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }
    // A release is signed when GAIUS_KEYSTORE names a keystore (with
    // GAIUS_KEYSTORE_PASSWORD, GAIUS_KEY_ALIAS, GAIUS_KEY_PASSWORD); without it
    // the release APK and bundle are unsigned.
    signingConfigs {
        if (System.getenv("GAIUS_KEYSTORE")) {
            release {
                storeFile file(System.getenv("GAIUS_KEYSTORE"))
                storePassword System.getenv("GAIUS_KEYSTORE_PASSWORD")
                keyAlias System.getenv("GAIUS_KEY_ALIAS")
                keyPassword System.getenv("GAIUS_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv("GAIUS_KEYSTORE")) {
                signingConfig signingConfigs.release
            }
        }
    }
    // Gaius's language files (lang/) go into the APK's assets as lang/.
    sourceSets.main.assets.srcDirs += "$buildDir/gaius-assets"
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"].dependsOn("copyGaiusLanguages")
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            cmake {
                path 'jni/CMakeLists.txt'
            }
        }

    }
    lint {
        abortOnError false
    }

    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "org.libsdl.app.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}

task copyGaiusLanguages(type: Copy) {
    from "${rootProject.projectDir}/../lang"
    into "$buildDir/gaius-assets/lang"
}

// Every task that reads the assets sees the languages.
preBuild.dependsOn copyGaiusLanguages
