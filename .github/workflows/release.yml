# SPDX-License-Identifier: GPL-3.0-or-later
# Builds every download of a release and publishes the GitHub release. docs/RELEASING.md says how to use it.
#
#   * Push a tag v<VERSION> (the VERSION.txt file): builds Windows, Linux, the web page and Android, then creates the release
#     with the CHANGELOG.md section as its notes and a SHA256SUMS file. A 0.x version is marked a pre-release.
#   * Run it by hand (Actions > release > Run workflow) with "publish" off for a dry run: the same builds, kept as
#     artifacts of the run, and no release.
#
# Android is signed when the repository has the secrets GAIUS_KEYSTORE_BASE64, GAIUS_KEYSTORE_PASSWORD, GAIUS_KEY_ALIAS and
# GAIUS_KEY_PASSWORD; without them the job builds a debug-signed APK (installable for testing) instead. The Android job may
# fail without stopping the release: its files are simply missing from it.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Create or update the GitHub release for the VERSION.txt file (off: a dry run, artifacts only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version="$(tr -d '[:space:]' < VERSION.txt)"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::VERSION.txt holds '$version', not x.y.z"; exit 1 ;;
          esac
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag $GITHUB_REF_NAME is not v$version, the VERSION.txt file's"; exit 1
          fi
          case "$version" in 0.*) pre=true ;; *) pre=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
      - name: The release notes exist
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: python3 scripts/release_notes.py "$VERSION" > /dev/null

  linux:
    needs: check
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libsdl2-dev
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j "$(nproc)"
      - name: Test
        run: ./build/gaius_tests
      - name: Package
        run: packaging/linux/make_tarball.sh build "gaius-$VERSION-linux-x86_64"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: gaius-*-linux-x86_64.tar.gz

  windows:
    needs: check
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.check.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      # SDL 2 and the C++ runtime linked in: gaius.exe is one file that needs nothing installed.
      - name: SDL2 (static)
        run: vcpkg install sdl2:x64-windows-static
      - name: Configure
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        run: ./build/Release/gaius_tests.exe
      - name: Package
        run: ./packaging/windows/make_zip.ps1 -Build build/Release -Name "gaius-$env:VERSION-windows-x64"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: gaius-*-windows-x64.zip

  web:
    needs: check
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.check.outputs.version }}
      EMSCRIPTEN_VERSION: "6.0.11"
    steps:
      - uses: actions/checkout@v4
      - name: Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          ./emsdk/emsdk install "$EMSCRIPTEN_VERSION"
          ./emsdk/emsdk activate "$EMSCRIPTEN_VERSION"
      - name: Build
        run: |
          source ./emsdk/emsdk_env.sh
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web -j "$(nproc)"
      - name: Package
        run: |
          name="gaius-$VERSION-web"
          mkdir "$name"
          cp build-web/index.html build-web/gaius.js build-web/gaius.wasm build-web/gaius.data \
             build-web/gaius-web.js build-web/gaius-web.css build-web/gaius-version.js build-web/banner.svg \
             LICENSE THIRD_PARTY_NOTICES.txt "$name/"
          cp web/README.md "$name/README.md"
          zip -r "$name.zip" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: gaius-*-web.zip

  android:
    needs: check
    runs-on: ubuntu-22.04
    continue-on-error: true
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GAIUS_KEYSTORE_PASSWORD: ${{ secrets.GAIUS_KEYSTORE_PASSWORD }}
      GAIUS_KEY_ALIAS: ${{ secrets.GAIUS_KEY_ALIAS }}
      GAIUS_KEY_PASSWORD: ${{ secrets.GAIUS_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-34" "build-tools;34.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
      - name: SDL2 source
        shell: pwsh
        run: ./android/fetch_sdl2.ps1
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.GAIUS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gaius.keystore"
            echo "GAIUS_KEYSTORE=$RUNNER_TEMP/gaius.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          mkdir -p ../dist
          if [ -n "$GAIUS_KEYSTORE" ]; then
            ./gradlew assembleRelease bundleRelease
            cp app/build/outputs/apk/release/app-release.apk "../dist/gaius-$VERSION-android.apk"
            cp app/build/outputs/bundle/release/app-release.aab "../dist/gaius-$VERSION-android.aab"
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "../dist/gaius-$VERSION-android-debug.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/*

  publish:
    needs: [check, linux, windows, web, android]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.linux.result == 'success' && needs.windows.result == 'success' && needs.web.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish) }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: |
          ls -l
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes
        run: |
          page="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          python3 scripts/release_notes.py "$VERSION" > notes.md
          {
            echo
            echo "---"
            echo "**Downloads:** Windows (one exe, nothing to install), Linux (needs SDL 2; the Steam Deck notes are inside), Android, and a zip of the web page to host yourself. Or play in the browser: $page"
            echo
            echo "You need your own copy of Caesar (1992); none is included. SHA-256 checksums are in \`SHA256SUMS\`."
          } >> notes.md
      - name: Publish
        run: |
          tag="v$VERSION"
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --title "Gaius $VERSION" --notes-file notes.md "${flags[@]}"
          else
            gh release create "$tag" dist/* --title "Gaius $VERSION" --notes-file notes.md --target "$GITHUB_SHA" "${flags[@]}"
          fi
